services:
  app:
    image: 'ghcr.io/tschuba/time-drift:${TAG:-latest}'
    expose:
      - 80
    environment:
      - SERVICE_PASSWORD_64_DB
      - 'DATABASE_URL=postgres://timedrift:${SERVICE_PASSWORD_64_DB}@db:5432/timedrift'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - 'traefik.http.middlewares.authentik-auth@file'
  db:
    image: 'postgres:16-alpine'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    environment:
      - SERVICE_PASSWORD_64_DB
      - POSTGRES_DB=timedrift
      - POSTGRES_USER=timedrift
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_DB}'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timedrift"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  pgdata:
