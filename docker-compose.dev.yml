# Local Postgres for `pnpm dev`. Matches the default DATABASE_URL.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: timedrift
      POSTGRES_USER: timedrift
      POSTGRES_PASSWORD: timedrift
    volumes:
      - devdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timedrift"]
      interval: 2s
      retries: 15
volumes:
  devdata:
