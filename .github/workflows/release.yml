name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT is needed so the created tag triggers build.yml (GITHUB_TOKEN events don't trigger workflows).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
